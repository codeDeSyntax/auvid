<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1726" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Cyan Accent Primary Gradient -->
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- Darker Teal Contrast Gradient -->
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#0e7490" />
    </linearGradient>

    <!-- Glowing Accent -->
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.3" />
    </linearGradient>

    <!-- Shadow filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#06b6d4" flood-opacity="0.35" />
    </filter>

    <filter id="innerGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Base Squircle Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />
  
  <!-- Subtle Ambient Core Glow -->
  <circle cx="256" cy="256" r="160" fill="#06b6d4" opacity="0.12" filter="url(#dropShadow)" />

  <!-- Monogram A + V Geometric Block Shape -->
  <g filter="url(#dropShadow)">
    <!-- LEFT PILLAR of "A" (Slanted Cyan block with waveform notch) -->
    <path d="M 196 112 
             L 256 112 
             L 168 368 
             L 108 368 
             Z" 
          fill="url(#cyanGrad)" />

    <!-- RIGHT PILLAR of "A" connecting down into "V" -->
    <path d="M 256 112 
             L 316 112 
             L 404 368 
             L 344 368 
             L 296 232 
             L 256 232 
             L 256 112 
             Z" 
          fill="url(#tealGrad)" />

    <!-- "V" INNER SHAPE (Interlocking Downward Apex) -->
    <path d="M 220 200 
             L 292 200 
             L 256 308 
             Z" 
          fill="#030712" 
          opacity="0.9" />

    <!-- "V" FOREGROUND WEDGE (Dynamic Angle with Film/Audio block cut) -->
    <path d="M 204 220 
             L 256 372 
             L 308 220 
             L 352 220 
             L 278 408 
             L 234 408 
             L 160 220 
             Z" 
          fill="url(#cyanGrad)" />

    <!-- HORIZONTAL EQUALIZER / MEDIA ACCENT BARS across the A-Crossbar -->
    <!-- Center Audio Equalizer Notch -->
    <rect x="194" y="272" width="20" height="44" rx="6" fill="#38bdf8" />
    <rect x="222" y="256" width="20" height="60" rx="6" fill="#22d3ee" />
    <rect x="250" y="244" width="12" height="72" rx="6" fill="#67e8f9" />
    <rect x="270" y="256" width="20" height="60" rx="6" fill="#22d3ee" />
    <rect x="298" y="272" width="20" height="44" rx="6" fill="#38bdf8" />

    <!-- Top Apex Geometric Indicator (Play / Audio Diamond Peak) -->
    <polygon points="256,92 272,112 240,112" fill="#67e8f9" />
  </g>

  <!-- Gloss Top Highlight -->
  <path d="M 32 120 C 32 60 70 32 130 32 L 382 32 C 442 32 480 60 480 120 C 360 140 160 140 32 120 Z" 
        fill="white" 
        opacity="0.04" />
</svg>
