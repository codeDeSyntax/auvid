<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' 'unsafe-inline';"
    />
    <title>AUVID — Audio & Video Studio</title>
    <!-- Apply theme class synchronously before first paint to prevent flash -->
    <script>
      try {
        var _dm = localStorage.getItem("darkMode");
        var _dark =
          _dm === null
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
            : _dm === "true";
        if (_dark) document.documentElement.classList.add("dark");
        var _ac = localStorage.getItem("accentColor");
        if (_ac) document.documentElement.style.setProperty("--accent", _ac);
      } catch (e) {}
    </script>
  </head>
  <body style="margin:0;padding:0;overflow:hidden">
    <div id="root">
      <!-- Inline loading screen — visible until React mounts and replaces #root contents -->
      <div id="preload-screen">
        <div class="preload-spinner-wrap">
          <div class="preload-spinner">
            <div class="_bar"></div>
            <div class="_bar"></div>
            <div class="_bar"></div>
            <div class="_bar"></div>
            <div class="_bar"></div>
            <div class="_bar"></div>
            <div class="_bar"></div>
            <div class="_bar"></div>
            <div class="_bar"></div>
            <div class="_bar"></div>
            <div class="_bar"></div>
            <div class="_bar"></div>
          </div>
          <div class="preload-title">AUVID</div>
        </div>
      </div>

      <style>
        #preload-screen {
          position: fixed;
          inset: 0;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          background: #1d1d1d;
          font-family: "Fraunces", system-ui, sans-serif;
          user-select: none;
        }
        .preload-spinner-wrap {
          position: relative;
          width: 170px;
          height: 170px;
          display: flex;
          align-items: center;
          justify-content: center;
        }
        .preload-spinner {
          position: absolute;
          inset: 0;
        }
        ._bar {
          position: absolute;
          left: 50%;
          top: 0;
          width: 4.5px;
          height: 22px;
          margin-left: -2.25px;
          border-radius: 3px;
          background: rgba(255, 255, 255, 0.05);
          transform-origin: 50% 85px;
          animation: radial-fade 1.2s linear infinite;
        }
        ._bar:nth-child(1)  { transform: rotate(0deg);   animation-delay: -1.1s; }
        ._bar:nth-child(2)  { transform: rotate(30deg);  animation-delay: -1.0s; }
        ._bar:nth-child(3)  { transform: rotate(60deg);  animation-delay: -0.9s; }
        ._bar:nth-child(4)  { transform: rotate(90deg);  animation-delay: -0.8s; }
        ._bar:nth-child(5)  { transform: rotate(120deg); animation-delay: -0.7s; }
        ._bar:nth-child(6)  { transform: rotate(150deg); animation-delay: -0.6s; }
        ._bar:nth-child(7)  { transform: rotate(180deg); animation-delay: -0.5s; }
        ._bar:nth-child(8)  { transform: rotate(210deg); animation-delay: -0.4s; }
        ._bar:nth-child(9)  { transform: rotate(240deg); animation-delay: -0.3s; }
        ._bar:nth-child(10) { transform: rotate(270deg); animation-delay: -0.2s; }
        ._bar:nth-child(11) { transform: rotate(300deg); animation-delay: -0.1s; }
        ._bar:nth-child(12) { transform: rotate(330deg); animation-delay: 0s; }

        @keyframes radial-fade {
          0% {
            background: #ffffff;
            opacity: 1;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.35);
          }
          100% {
            background: rgba(255, 255, 255, 0.05);
            opacity: 0.15;
          }
        }
        .preload-title {
          position: absolute;
          color: rgba(255, 255, 255, 0.85);
          font-size: 14px;
          font-weight: 500;
          letter-spacing: 0.12em;
          text-transform: uppercase;
          text-align: center;
          pointer-events: none;
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
