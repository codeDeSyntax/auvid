<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' 'unsafe-inline';"
    />
    <title>AUVID — Audio & Video Studio</title>
    <!-- Apply theme class synchronously before first paint to prevent flash -->
    <script>
      try {
        var _dm = localStorage.getItem("darkMode");
        var _dark =
          _dm === null
            ? window.matchMedia("(prefers-color-scheme: dark)").matches
            : _dm === "true";
        if (_dark) document.documentElement.classList.add("dark");
        var _ac = localStorage.getItem("accentColor");
        if (_ac) document.documentElement.style.setProperty("--accent", _ac);
      } catch (e) {}
    </script>
  </head>
  <body style="margin:0;padding:0;overflow:hidden">
    <div id="root">
      <!-- Inline loading screen with 3D tactile acoustic fins and empty state artwork -->
      <div id="preload-screen">
        <canvas id="preload-canvas"></canvas>
        
        <div class="center-art-wrap">
          <div class="art-glow"></div>
          <img src="./empty-trimmer.png" alt="AUVID Studio" class="center-art-img" />
        </div>
      </div>

      <style>
        #preload-screen {
          position: fixed;
          inset: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          background: #09090b;
          font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
          user-select: none;
          overflow: hidden;
          z-index: 99999;
        }

        #preload-canvas {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          pointer-events: none;
        }

        .center-art-wrap {
          position: relative;
          z-index: 10;
          display: flex;
          align-items: center;
          justify-content: center;
          animation: floatArt 3.5s ease-in-out infinite alternate;
        }

        .art-glow {
          position: absolute;
          width: 180px;
          height: 180px;
          border-radius: 50%;
          background: radial-gradient(circle, var(--accent, #06b6d4) 0%, rgba(139, 92, 246, 0.25) 45%, transparent 70%);
          filter: blur(40px);
          opacity: 0.35;
          pointer-events: none;
          animation: pulseGlow 3s ease-in-out infinite alternate;
        }

        .center-art-img {
          position: relative;
          width: 130px;
          height: 130px;
          object-fit: contain;
          filter: drop-shadow(0 14px 28px rgba(0, 0, 0, 0.75));
          user-select: none;
          pointer-events: none;
        }

        @keyframes floatArt {
          0% { transform: translateY(-5px) scale(0.98); }
          100% { transform: translateY(6px) scale(1.02); }
        }

        @keyframes pulseGlow {
          0% { transform: scale(0.85); opacity: 0.25; }
          100% { transform: scale(1.2); opacity: 0.5; }
        }
      </style>

      <script>
        (function() {
          var canvas = document.getElementById('preload-canvas');
          if (!canvas) return;
          var ctx = canvas.getContext('2d');
          if (!ctx) return;

          var accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#06b6d4';

          function render() {
            var dpr = window.devicePixelRatio || 1;
            var w = window.innerWidth;
            var h = window.innerHeight;

            if (canvas.width !== w * dpr || canvas.height !== h * dpr) {
              canvas.width = w * dpr;
              canvas.height = h * dpr;
            }

            ctx.save();
            ctx.scale(dpr, dpr);
            ctx.clearRect(0, 0, w, h);

            var numFins = 14;
            var clusterWidth = Math.min(w * 0.72, 480);
            var startX = (w - clusterWidth) / 2;
            var finSpacing = clusterWidth / numFins;
            var finWidth = finSpacing * 0.72;
            var centerY = h / 2;
            var time = Date.now() * 0.0025;

            for (var i = 0; i < numFins; i++) {
              var x = startX + finSpacing * i + (finSpacing - finWidth) / 2;
              var distFromCenter = Math.abs(i - (numFins - 1) / 2) / ((numFins - 1) / 2);

              var wave1 = Math.sin(time * 1.2 + i * 0.35) * 0.28;
              var wave2 = Math.cos(time * 0.8 + i * 0.25) * 0.22;
              var intensity = 0.45 + (wave1 + wave2) * 0.2;

              var maxH = h * 0.58;
              var finHeight = Math.max(50, intensity * maxH);

              var depthScale = 1 - distFromCenter * 0.25;
              var curH = finHeight * depthScale;
              var curW = finWidth * depthScale;
              var y = centerY - curH / 2;
              var radius = Math.min(18, curW * 0.45);

              // 1. Deep 3D Shadow
              ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
              ctx.beginPath();
              ctx.roundRect(x + 8 * depthScale, y + 10 * depthScale, curW, curH, radius);
              ctx.fill();

              // 2. Extrusion Side Body
              var sideGrad = ctx.createLinearGradient(x, y, x + curW + 6, y + curH);
              sideGrad.addColorStop(0, '#18181b');
              sideGrad.addColorStop(0.5, '#09090b');
              sideGrad.addColorStop(1, '#000000');
              ctx.fillStyle = sideGrad;
              ctx.beginPath();
              ctx.roundRect(x + 4 * depthScale, y + 4 * depthScale, curW, curH, radius);
              ctx.fill();

              // 3. Main Face (Illuminated Volumetric Block)
              var faceGrad = ctx.createLinearGradient(x, y, x + curW, y + curH);
              faceGrad.addColorStop(0, accent);
              faceGrad.addColorStop(0.5, accent);
              faceGrad.addColorStop(1, '#18181b');

              ctx.fillStyle = faceGrad;
              ctx.beginPath();
              ctx.roundRect(x, y, curW, curH, radius);
              ctx.fill();

              // 4. Polished Bevel Highlight Rim
              ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
              ctx.beginPath();
              ctx.roundRect(x + 1, y + 1, curW - 2, Math.max(3, 5 * depthScale), [radius, radius, 2, 2]);
              ctx.fill();
            }

            ctx.restore();
            requestAnimationFrame(render);
          }

          requestAnimationFrame(render);
        })();
      </script>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
